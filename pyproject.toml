[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybershield_threat_intelligence_soc_analytics"
version = "1.0.0"
description = "Enterprise Cybersecurity & SOC Operations Analytics Data Warehouse: MTTD/MTTR telemetry, MITRE ATT&CK matrix heatmaps, false-positive suppression, and phishing triage."
readme = "README.md"
authors = [
    { name = "Abdussatar", email = "satarabdus692@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
